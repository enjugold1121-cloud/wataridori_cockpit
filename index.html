<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>渡り鳥の操縦席</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="操縦席">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F5F0">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
  // 初回描画前にテーマを当てて、ちらつきを防ぐ
  try {
    var saved = JSON.parse(localStorage.getItem('wb.v1.settings') || '{}');
    if (saved.theme === 'dark') document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1 class="brand">渡り鳥の操縦席</h1>
    <div class="clock">
      <span id="clock-date"></span>
      <strong id="clock-time"></strong>
    </div>
    <div class="status" id="cal-status" role="status"></div>
    <div class="topbar-actions">
      <button class="btn btn-primary" id="nav-btn" data-act="nav"></button>
      <button class="btn" data-act="settings">設定</button>
    </div>
  </header>

  <main id="page-main" class="cockpit" data-tab="today">
    <section class="col col-hold" aria-label="保留">
      <header class="col-head">
        <div>
          <h2>保留 <span class="count" id="hold-count"></span></h2>
          <p class="col-sub">今はやらないと決めた仕事</p>
        </div>
        <button class="icon-btn" data-act="add" data-kind="hold" aria-label="保留に付箋を追加">＋</button>
      </header>
      <ul class="notes notes-hold" id="hold-list" data-kind="hold"></ul>
    </section>

    <section class="col col-today" aria-label="今日の時間割">
      <header class="col-head">
        <div class="today-head">
          <div>
            <h2 id="today-title">今日の時間割</h2>
            <p class="col-sub" id="today-sub"></p>
          </div>
          <span id="today-switch"></span>
        </div>
        <div class="timer-slot-head" id="today-timer"></div>
      </header>
      <div class="timeline" id="timeline"></div>
    </section>

    <section class="col col-life" aria-label="生活の付箋">
      <header class="col-head">
        <div>
          <h2>生活の付箋</h2>
          <p class="col-sub" id="life-sub"></p>
        </div>
        <button class="icon-btn" data-act="add" data-kind="life" aria-label="生活の付箋を追加">＋</button>
      </header>
      <ul class="notes notes-life" id="life-list" data-kind="life"></ul>
      <footer class="life-foot" id="life-foot"></footer>
    </section>
  </main>

  <nav class="tabs" aria-label="表示の切替">
    <button class="tab" data-act="tab" data-tab="hold">保留</button>
    <button class="tab" data-act="tab" data-tab="today">今日</button>
    <button class="tab" data-act="tab" data-tab="life">生活</button>
  </nav>

  <main id="page-calendar" class="calendar" hidden></main>
</div>

<dialog id="sheet" class="sheet"></dialog>
<dialog id="settings" class="sheet"></dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script src="vendor/Sortable.min.js"></script>
<script src="js/time.js"></script>
<script src="js/store.js"></script>
<script src="js/calendar-provider.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script src="js/calendar-view.js"></script>
</body>
</html>
